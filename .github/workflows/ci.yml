name: ThreatScope checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: threatscope_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/threatscope_test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.19'
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check backend scripts
      - run: uv run ruff format --check backend scripts
      - run: uv run pytest --cov=threatscope --cov-report=xml --cov-fail-under=90
      - name: Reproduce evaluation artifact
        run: |
          PYTHONPATH=backend uv run python -m threatscope.ml.evaluate
          git diff --exit-code docs/ml-evaluation.json
      - name: Verify synthetic import fixtures
        run: |
          PYTHONPATH=backend uv run python scripts/generate_samples.py
          git diff --exit-code samples
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: coverage.xml

  frontend-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.19'
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.19'
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: uv export --frozen --no-dev --no-hashes --output-file /tmp/threatscope-requirements.txt
      - run: uvx --from pip-audit pip-audit --requirement /tmp/threatscope-requirements.txt --progress-spinner off
