[project]
name = "threatscope"
version = "0.1.0"
description = "Defensive security analytics and explainable synthetic investigations"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2", "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pytest-cov>=6,<8"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["threatscope"]
