# Deployment preparation only: creating these persistent resources may incur charges.
services:
  - type: web
    name: threatscope-api
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    buildCommand: uv sync --frozen --no-dev
    startCommand: .venv/bin/uvicorn threatscope.main:app --app-dir backend --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 32 --timeout-keep-alive 5 --no-proxy-headers
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: ENVIRONMENT
        value: production
      - key: API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: threatscope-db
          property: connectionString
databases:
  - name: threatscope-db
    plan: 0.1c-256mb
    region: oregon
    databaseName: threatscope
    user: threatscope
    diskSizeGB: 5
    ipAllowList: []
